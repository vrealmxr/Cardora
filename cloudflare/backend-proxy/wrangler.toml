name = "cardora-backend-proxy"
main = "src/worker.js"
compatibility_date = "2026-07-17"
workers_dev = false

routes = [
  { pattern = "api.cardora.gr/*", zone_name = "cardora.gr" },
  # More specific than the Pages custom domain on cardora.gr/*, so this wins
  # for /storage/* without touching the Pages project. The Pages Worker
  # (cloudflare/backend-proxy-pages) uses this exact resolveOverride pattern
  # too, but resolveOverride is silently ignored there — Pages projects
  # don't carry the zone_name binding this security check requires — so its
  # fetch to https://cardora.gr falls through to normal DNS, re-enters
  # Cloudflare's edge, and loops (Error 1019). This Worker has a real
  # zone_name route, so resolveOverride actually reaches the origin here.
  { pattern = "cardora.gr/storage/*", zone_name = "cardora.gr" },
  # Same issue, much bigger blast radius: the deployed frontend build uses
  # VITE_API_BASE_URL=/index.php/api (relative, not https://api.cardora.gr),
  # so EVERY API call — bootstrap, listings, login, checkout, all of it —
  # goes through cardora.gr/index.php/* and was hitting the same broken
  # Pages Worker loop (Error 1019).
  { pattern = "cardora.gr/index.php*", zone_name = "cardora.gr" },
  # asset.php serves bootstrap.min.css/js and other root-level assets that
  # aren't part of the Pages static build, so they also fell through to the
  # broken Pages Worker.
  { pattern = "cardora.gr/asset.php*", zone_name = "cardora.gr" },
  # Pages doesn't recognize .webmanifest as a static asset type, so this one
  # file falls through too even though its sibling icons (.ico/.png) don't.
  { pattern = "cardora.gr/icons/site.webmanifest", zone_name = "cardora.gr" },
  # Direct /api/* calls (not the /index.php/api/* the SPA uses) — this is
  # where server-to-server callers hit us directly, e.g. Stripe webhooks
  # (https://cardora.gr/api/stripe/webhooks). Found broken (Error 1019, same
  # Pages-loop cause as above) while verifying the Cardora PRO subscription
  # webhook flow: Stripe events were generating fine but every delivery
  # attempt to this URL 503'd, so NO webhook of any kind — order payments,
  # refunds, payouts, account updates — had been reaching the app since the
  # Pages loop bug appeared. /api/* has no reason to ever serve the SPA, so
  # routing all of it straight to the real origin is safe.
  { pattern = "cardora.gr/api/*", zone_name = "cardora.gr" },
  # routes/web.php signed-link redirect endpoints — email verification and
  # the Stripe Connect onboarding return/refresh URLs. Same Pages-loop gap:
  # these were falling through to the SPA (200 text/html, React's own 404)
  # instead of reaching Laravel, so sellers landed on "page not found" right
  # after finishing Stripe onboarding, and the account never got its
  # post-onboarding sync/redirect. Found while going live with Stripe.
  { pattern = "cardora.gr/stripe/connect/*", zone_name = "cardora.gr" },
  { pattern = "cardora.gr/email/verify/*", zone_name = "cardora.gr" },
  # Filament admin panel (routes/web.php, id 'admin', path 'admin') — same
  # gap, same fix. Nothing under /admin should ever be the SPA.
  { pattern = "cardora.gr/admin", zone_name = "cardora.gr" },
  { pattern = "cardora.gr/admin/*", zone_name = "cardora.gr" },
  # Found while fixing /admin: Filament's own export/import download links
  # and Livewire's JS assets (Filament is built on Livewire — without these
  # loading, the admin panel UI wouldn't actually work even once /admin
  # itself resolved) live outside /admin/* too.
  { pattern = "cardora.gr/filament/*", zone_name = "cardora.gr" },
  { pattern = "cardora.gr/livewire/*", zone_name = "cardora.gr" },
  # The actual published Filament vendor assets (CSS/JS) live under these —
  # confirmed the only two folders present on origin's public/css, public/js.
  { pattern = "cardora.gr/css/filament/*", zone_name = "cardora.gr" },
  { pattern = "cardora.gr/js/filament/*", zone_name = "cardora.gr" }
]
